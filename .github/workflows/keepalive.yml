# Mantiene activo el proyecto de Supabase (el plan gratuito lo pausa tras ~7 días sin actividad).
# Hace una consulta de solo lectura cada 3 días.
# Requiere dos secretos del repo (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       = el mismo valor de VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY  = el mismo valor de VITE_SUPABASE_ANON_KEY
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 9 */3 * *'   # 09:23 UTC, cada 3 días
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Consulta a Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY en el repo."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1"
          echo
